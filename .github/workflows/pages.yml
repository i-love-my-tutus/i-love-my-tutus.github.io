name: Publier le site anniversaire
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ne pas publier les contenus avant l’ouverture
        run: node -e "if(Date.now()<Date.parse('2026-10-08T20:59:00Z')){console.error('Publication bloquée avant le 8 octobre à 23:59 Sofia. Relancer ce workflow après cette heure.');process.exit(1)}"
      - run: npm install --no-save --package-lock=false sharp
      - run: npm run build
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
